<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kata Kilat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom ala aplikasi HP (maks 480px). Atas: bar waktu. Tengah: soal. Bawah: pilihan jawaban di jangkauan jempol. Satu dunia visual gelap, satu aksen kuning. */
:root{
  color-scheme: dark;
  --bg:#0F1B26;
  --surface:#172836;
  --surface-2:#203446;
  --line:#2C4457;
  --fg:#EDF4F8;
  --muted:#93A9B8;
  --accent:#FFD23F;
  --accent-ink:#241B00;
  --good:#3DDC97;
  --good-bg:#12382C;
  --bad:#FF6270;
  --bad-bg:#40202A;
  --font-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#app{min-height:100%}
.wrap{max-width:480px;margin:0 auto;padding:16px;min-height:100%;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h2{font-size:.8rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.emo,.emo-xl,.chip i,.tile,.tile-xl{font-family:var(--font-emoji);font-style:normal}

/* Beranda */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:2.1rem;font-weight:700;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.lead{margin:0;color:var(--muted);max-width:36ch}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--fg);flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.lg{width:52px;height:52px;background:var(--surface-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:20px;padding:14px 4px}
.stats>div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:0 6px}
.stats>div+div{border-left:1px solid var(--line)}
.stats b{font-family:var(--font-display);font-size:1.35rem;font-weight:600;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--muted);text-align:center}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 72px;padding:11px 8px;border-radius:14px;background:var(--surface);border:2px solid transparent;font-weight:700;font-size:.92rem}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.seg button:disabled{opacity:.4;cursor:default}
.hint{margin:-10px 0 0;color:var(--muted);font-size:.85rem}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border-radius:20px;padding:14px;min-width:0;border:2px solid transparent;transition:transform .12s}
.cat:active{transform:scale(.97)}
.cat .tile{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.cat .nm{font-family:var(--font-display);font-weight:600;font-size:1.05rem;line-height:1.15}
.cat .nm small{display:block;font-family:var(--font-body);font-weight:400;font-size:.78rem;color:var(--muted)}
.meter{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--c);border-radius:99px}
.cat .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat.all{grid-column:1/-1;flex-direction:row;align-items:center;--c:var(--accent)}
.cat.all .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

/* Sesi */
.hud{display:flex;align-items:center;gap:12px}
.track{flex:1;height:12px;border-radius:99px;background:var(--surface);overflow:hidden}
.track i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px;transition:width .25s linear}
.track i.low{background:var(--bad)}
.clock{font-family:var(--font-display);font-weight:600;min-width:3.2ch;text-align:right;font-variant-numeric:tabular-nums}
.play{gap:18px}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-block:8px;flex:1;min-width:0}
.cue{margin:0;color:var(--muted);font-size:.95rem}
.cue b{color:var(--fg);font-size:1.15em}
.say{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.big-word{font-family:var(--font-display);font-size:2.6rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.meaning-big{font-family:var(--font-display);font-size:2.1rem;font-weight:600;line-height:1.15;margin:0;overflow-wrap:anywhere;color:var(--accent)}
.emo-xl{font-size:6rem;line-height:1.05}
.tile-xl{width:150px;height:150px;border-radius:36px;display:grid;place-items:center;background:var(--surface);font-size:5.5rem}
.meaning{font-family:var(--font-display);font-size:1.4rem;color:var(--accent);margin:0;overflow-wrap:anywhere}
.example{margin:0;max-width:34ch;color:var(--muted);font-size:1rem}
.example b{color:var(--fg)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.listen .disc{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{border-radius:22px;background:var(--surface);border:2px solid var(--line);transition:transform .1s,background .15s,border-color .15s}
.opt:not(:disabled):active{transform:scale(.96)}
.opt.pic{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;font-size:4rem}
.opt.pic .emo{line-height:1}
.opts{display:flex;flex-direction:column;gap:10px}
.opt.txt{padding:15px 18px;text-align:left;font-family:var(--font-display);font-weight:600;font-size:1.25rem;overflow-wrap:anywhere}
.opt.ok{background:var(--good-bg);border-color:var(--good)}
.opt.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.opt.dim{opacity:.4}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:84px;border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;justify-content:center;gap:2px;visibility:hidden}
.fb.good,.fb.bad{visibility:visible}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb b{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.fb span{color:var(--fg);font-size:.95rem;overflow-wrap:anywhere}
.btn{background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:600;font-size:1.1rem;padding:14px 22px;border-radius:16px;min-height:52px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:var(--surface);color:var(--fg)}
.btn.sm{align-self:flex-start;margin-top:8px;padding:8px 16px;min-height:0;font-size:.95rem;background:var(--fg);color:var(--bg)}
.link{color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:8px;align-self:center}
form.type{display:flex;gap:10px;width:100%}
form.type input{flex:1;min-width:0;font:600 1.4rem var(--font-display);letter-spacing:.04em;text-align:center;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg)}
form.type .btn{flex:none}
.hintline{font-family:var(--font-display);letter-spacing:.2em;color:var(--accent);min-height:1.6em;margin:0;overflow-wrap:anywhere}

/* Soal baru */
.pair{background:var(--surface);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.pair .big-word{font-size:2.2rem}
.sent{font-family:var(--font-display);font-size:1.45rem;line-height:1.4;margin:0;text-wrap:balance;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:3.5ch;border-bottom:3px solid var(--accent);color:var(--accent)}
.blank.ok{color:var(--good);border-color:var(--good)}
.blank.no{color:var(--bad);border-color:var(--bad)}
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.mb{min-height:66px;border-radius:16px;background:var(--surface);border:2px solid var(--line);padding:8px 10px;font-family:var(--font-display);font-weight:600;font-size:1.05rem;display:grid;place-items:center;text-align:center;overflow-wrap:anywhere;transition:background .15s,border-color .15s}
.mb .emo{font-size:2.2rem;line-height:1}
.mb.sel{border-color:var(--accent);background:var(--surface-2)}
.mb.ok{background:var(--good-bg);border-color:var(--good)}
.mb.no{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
.mb:disabled{cursor:default}
.slots,.ltrs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot{width:42px;height:52px;border-radius:12px;border:2px dashed var(--line);background:var(--surface);font:600 1.5rem var(--font-display);text-transform:uppercase}
.slot.f{border-style:solid;border-color:var(--accent)}
.slot.good{border-color:var(--good);background:var(--good-bg)}
.slot.bad{border-color:var(--bad);background:var(--bad-bg)}
.slot:disabled{cursor:default;color:inherit}
.ltr{width:46px;height:54px;border-radius:14px;background:var(--surface-2);font:600 1.5rem var(--font-display);text-transform:uppercase}
.ltr:disabled{opacity:.25;cursor:default}
.ltr:not(:disabled):active{transform:scale(.94)}


/* Tenses */
.vb{color:var(--muted);font-size:.7em}
.trl{color:var(--muted)!important;font-size:.85rem!important}
.lk{color:var(--c);font-weight:600}
.lesson{gap:16px}
.uses{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.fms{display:flex;flex-direction:column;gap:10px}
.fm{background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fl{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.fm code{font-family:var(--font-display);font-weight:600;font-size:1.05rem;overflow-wrap:anywhere}
.fe{color:var(--muted);font-size:.92rem}
.sig{margin:0;background:var(--surface);border-radius:16px;padding:12px 14px;font-family:var(--font-display);font-weight:500}
.tipbox{margin:0;background:var(--surface);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px}
.exs .chip{padding:10px 8px 10px 14px}
.wslots{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:10px;border-radius:16px;border:2px dashed var(--line);background:var(--surface)}
.wslots .ph{color:var(--muted);font-size:.9rem}
.wtiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wt{padding:10px 14px;border-radius:12px;background:var(--surface-2);font:600 1.05rem var(--font-display);overflow-wrap:anywhere}
.wt.on{background:var(--surface);border:2px solid var(--accent)}
.wt.on.good{border-color:var(--good);background:var(--good-bg)}
.wt.on.bad{border-color:var(--bad);background:var(--bad-bg)}
.wt:disabled{opacity:.3;cursor:default}
.wt.on:disabled{opacity:1}
.wt:not(:disabled):active{transform:scale(.95)}

/* Hasil */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score>div{background:var(--surface);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.score b{font-family:var(--font-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.score span{font-size:.75rem;color:var(--muted);text-align:center}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.chip{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px}
.chip i{font-size:1.6rem}
.chip div{flex:1;min-width:0;overflow-wrap:anywhere}
.chip b{font-family:var(--font-display);font-weight:600}
.chip small{display:block;color:var(--muted)}
.chip em{font-style:normal;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:99px;flex:none}
.chip.ok em{background:var(--good-bg);color:var(--good)}
.chip.no em{background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.empty{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

function dkey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

var ac=null;
function tone(f,start,dur,type,vol){
  var o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,ac.currentTime+start);
  g.gain.linearRampToValueAtTime(vol,ac.currentTime+start+.02);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+start+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(ac.currentTime+start);o.stop(ac.currentTime+start+dur+.05);
}
function sfx(ok){

}

/* ---------- Sesi ---------- */
function start(catId){
  var pool;
  if(catId==='review'){
    pool=WORDS.filter(function(w){var s=st(w);return s>=0&&s<3;});
    if(pool.length<4){pool=WORDS;catId='all';}
  }else{pool=catId==='all'?WORDS:BYCAT[catId];}
  G={cat:catId,pool:pool,total:S.dur*1000,end:Date.now()+S.dur*1000,asked:0,right:0,xp:0,recent:[],log:{},order:[],q:null,locked:true,adv:null,timer:null,introAt:0,introWord:null,lastType:''};
  G.timer=setInterval(tick,250);
  next();
}
function tick(){
  if(!G)return;
  var left=G.end-Date.now();
  if(left<=0){finish();return;}
  var bar=$('#bar'),c=$('#clock');
  if(bar){bar.style.width=(left/G.total*100)+'%';bar.classList.toggle('low',left<15000);}
  if(c)c.textContent=fmt(left);
}
function hud(){
  var left=G.end-Date.now();
  return '<div class="hud"><button class="icon-btn" data-act="end" aria-label="Akhiri sesi">'+ICON_X+'</button>'+
    '<div class="track"><i id="bar" style="width:'+(left/G.total*100)+'%"></i></div><span class="clock" id="clock">'+fmt(left)+'</span></div>';
}
function nextWord(){
  var unseen=G.pool.filter(function(w){return st(w)<0;});
  var weak=G.pool.filter(function(w){var s=st(w);return s>=0&&s<2;}).length;
  if(unseen.length&&weak<3)return {w:rand(unseen),intro:true};
  var c=G.pool.filter(function(w){return st(w)>=0&&G.recent.indexOf(w.en)<0;});
  if(!c.length)c=G.pool.filter(function(w){return st(w)>=0;});
  if(!c.length)return {w:rand(unseen),intro:true};
  var wt=c.map(function(w){var s=st(w);return s>=3?1:(4-s)*2;});
  var sum=wt.reduce(function(a,b){return a+b;},0),r=Math.random()*sum;
  for(var i=0;i<c.length;i++){r-=wt[i];if(r<=0)return {w:c[i],intro:false};}
  return {w:c[c.length-1],intro:false};
}
function matchOK(){return G&&G.pool.filter(function(x){return st(x)>=0;}).length>=4;}
function eligible(w,s,mode){
  var hasE=!!w.e,list=[];
  function add(t,min,max,ok){if(ok!==false&&s>=min&&s<=max)list.push(t);}
  add('pic',0,1,hasE);
  add('word',0,2,hasE);
  add('en2id',0,hasE?2:3);
  add('id2en',1,3);
  add('tf',0,3);
  add('match',0,2,matchOK());
  add('listen',1,3,CAN_SPEAK);
  add('dictate',2,3,CAN_SPEAK&&w.en.length<=24);
  add('scramble',1,3,w.scr);
  add('cloze',1,3,w.cl);
  add('type',2,3,w.en.length<=24);
  var set=MODES[mode];
  return set?list.filter(function(t){return set.indexOf(t)>=0;}):list;
}
function typeFor(w){
  var s=Math.max(0,st(w));
  var f=eligible(w,s,S.mode);
  if(!f.length)f=eligible(w,s,'mix');
  var g=f.filter(function(t){return t!==G.lastType;});
  return rand(g.length?g:f);
}
function dis(w,n,key,pred){
  var used={},out=[];
  used[w[key]]=true;
  shuffle(BYCAT[w.cat]).forEach(function(x){
    if(out.length>=n||x===w||used[x[key]]||(pred&&!pred(x)))return;
    used[x[key]]=true;out.push(x);
  });
  return out;
}
function makeQ(w,type){
  type=type||typeFor(w);
  var q={w:w,type:type,hinted:false,opts:[],lab:'en'};
  function pics(){q.opts=shuffle([w].concat(dis(w,3,'e',function(x){return !!x.e;})));}
  if(type==='pic'){pics();}
  else if(type==='listen'){
    if(w.e)pics();else{q.lab='id';q.opts=shuffle([w].concat(dis(w,3,'id')));}
  }
  else if(type==='en2id'){q.lab='id';q.opts=shuffle([w].concat(dis(w,3,'id')));}
  else if(type==='word'||type==='id2en'||type==='cloze'){q.opts=shuffle([w].concat(dis(w,3,'en')));}
  else if(type==='tf'){
    var o=dis(w,1,'en')[0];
    q.truth=Math.random()<0.5||!o;
    q.shown=q.truth?w:o;
  }
  else if(type==='match'){
    var items=[w];
    var cand=shuffle(G.pool.filter(function(x){return st(x)>=0&&x!==w&&x.cat===w.cat;})).concat(shuffle(G.pool.filter(function(x){return st(x)>=0&&x!==w;})));
    cand.forEach(function(x){
      if(items.length>=4)return;
      var okk=items.every(function(y){return y.en!==x.en&&y.id!==x.id&&(!x.e||x.e!==y.e);});
      if(okk)items.push(x);
    });
    if(items.length<4)return makeQ(w,'tf');
    q.mw=shuffle(items);q.mr=shuffle([0,1,2,3]);q.sel=-1;q.done=0;q.bad={};
  }
  else if(type==='scramble'){
    var letters=w.en.split(''),tiles,tries=0;
    do{tiles=shuffle(letters.map(function(ch,i){return {ch:ch,i:i};}));tries++;}
    while(tiles.map(function(t){return t.ch;}).join('')===w.en&&tries<8);
    q.tiles=tiles;q.pick=[];
  }
  return q;
}
function next(){
  if(!G)return;
  clearTimeout(G.adv);
  var n=nextWord();
  if(n.intro){showIntro(n.w);}
  else{var q=makeQ(n.w);G.q=q;showQ(q);}
}
function blankSent(w){
  return w.sent.replace(new RegExp('\\b'+w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'<span class="blank" id="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span>');
}
function boldSent(w){
  return w.sent.replace(new RegExp('\\b'+w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),function(m){return '<b>'+m+'</b>';});
}
function showIntro(w){
  S.w[w.en]={s:0};save();
  G.introAt=Date.now();G.introWord=w;G.locked=true;G.q=null;
  app.innerHTML='<main class="wrap play">'+hud()+
    '<div class="stage"><p class="cue">Kata baru</p>'+
    (w.e?'<div class="tile-xl" aria-hidden="true">'+w.e+'</div>':'')+
    '<div class="say"><span class="big-word">'+w.en+'</span>'+spk(w.en)+'</div>'+
    '<p class="meaning">'+w.id+'</p>'+
    (w.sent?'<p class="example">'+boldSent(w)+'</p>':'')+'</div>'+
    '<button class="btn" data-act="introok">Mengerti</button></main>';
}
function cueHtml(w){
  return w.e?'<div class="emo-xl" aria-hidden="true">'+w.e+'</div>':'<p class="meaning-big">'+w.id+'</p>';
}
function gridHtml(q){
  return '<div class="grid4">'+q.opts.map(function(o,i){
    return '<button class="opt pic" data-act="pick" data-i="'+i+'" aria-label="Pilihan '+(i+1)+'"><span class="emo">'+o.e+'</span></button>';
  }).join('')+'</div>';
}
function textHtml(q){
  return '<div class="opts">'+q.opts.map(function(o,i){
    return '<button class="opt txt" data-act="pick" data-i="'+i+'">'+o[q.lab]+'</button>';
  }).join('')+'</div>';
}
function scHtml(q){
  var w=q.w,slots='',tiles='',p;
  for(p=0;p<w.en.length;p++){
    var ti=q.pick[p];
    slots+='<button class="slot'+(ti!==undefined?' f':'')+'" data-act="unpick" data-p="'+p+'"'+(ti===undefined?' disabled':'')+' aria-label="Huruf '+(p+1)+'">'+(ti!==undefined?q.tiles[ti].ch:'')+'</button>';
  }
  q.tiles.forEach(function(t,i){
    tiles+='<button class="ltr" data-act="tile" data-i="'+i+'"'+(q.pick.indexOf(i)>=0?' disabled':'')+'>'+t.ch+'</button>';
  });
  return '<div class="slots" id="slots">'+slots+'</div><div class="ltrs">'+tiles+'</div><button class="link" data-act="undo" type="button">Hapus huruf terakhir</button>';
}
function typeForm(q,withHint){
  var w=q.w;
  return '<form class="type" id="tf" autocomplete="off"><input id="ans" maxlength="'+(w.en.length+3)+'" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Jawaban" placeholder="'+w.en.length+' karakter"><button class="btn" type="submit">Cek</button></form>'+
    (withHint?'<button class="link" data-act="hint" type="button">Beri huruf pertama</button>':'');
}
function showQ(q){
  var w=q.w,mid='',low='';
  G.lastType=q.type;
  G.recent.push(w.en);if(G.recent.length>3)G.recent.shift();
  G.locked=false;
  switch(q.type){
    case 'pic':
      mid='<p class="cue">Pilih gambar yang cocok</p><div class="say"><span class="big-word">'+w.en+'</span>'+spk(w.en)+'</div>';
      low=gridHtml(q);break;
    case 'word':
      mid='<p class="cue">Apa bahasa Inggrisnya?</p><div class="emo-xl" aria-hidden="true">'+w.e+'</div>';
      low=textHtml(q);break;
    case 'en2id':
      mid='<p class="cue">Apa artinya?</p><div class="say"><span class="big-word">'+w.en+'</span>'+spk(w.en)+'</div>';
      low=textHtml(q);break;
    case 'id2en':
      mid='<p class="cue">Apa bahasa Inggrisnya?</p><p class="meaning-big">'+w.id+'</p>';
      low=textHtml(q);break;
    case 'listen':
      mid='<p class="cue">'+(w.e?'Dengarkan, lalu pilih gambarnya':'Dengarkan, lalu pilih artinya')+'</p><button class="listen" data-act="speak" data-t="'+w.en+'" aria-label="Putar ulang"><span class="disc">'+ICON_SPK_XL+'</span><span>Ketuk untuk mengulang</span></button>';
      low=w.e?gridHtml(q):textHtml(q);break;
    case 'tf':
      mid='<p class="cue">Apakah pasangan ini benar?</p><div class="pair">'+cueHtml(w)+'<div class="say"><span class="big-word">'+q.shown.en+'</span></div></div>';
      low='<div class="opts"><button class="opt txt" data-act="tf" data-v="1">Benar</button><button class="opt txt" data-act="tf" data-v="0">Salah</button></div>';break;
    case 'cloze':
      mid='<p class="cue">Lengkapi kalimatnya. Arti kata yang dicari: <b>'+w.id+'</b></p><p class="sent">'+blankSent(w)+'</p>';
      low=textHtml(q);break;
    case 'match':
      mid='<p class="cue">Pasangkan kata dengan artinya</p>';
      low='<div class="match"><div class="col">'+q.mw.map(function(x,i){return '<button class="mb" data-act="mL" data-i="'+i+'">'+x.en+'</button>';}).join('')+'</div><div class="col">'+
        q.mr.map(function(idx,j){var x=q.mw[idx];return '<button class="mb" data-act="mR" data-j="'+j+'">'+(x.e?'<span class="emo">'+x.e+'</span>':x.id)+'</button>';}).join('')+'</div></div>';break;
    case 'scramble':
      mid='<p class="cue">Susun hurufnya menjadi kata Inggris</p>'+cueHtml(w)+(w.e?'<p class="meaning">'+w.id+'</p>':'');
      low='<div id="sc" class="stage" style="flex:none;gap:12px">'+scHtml(q)+'</div>';break;
    case 'dictate':
      mid='<p class="cue">Dengarkan, lalu tulis kata yang kamu dengar</p><button class="listen" data-act="speak" data-t="'+w.en+'" aria-label="Putar ulang"><span class="disc">'+ICON_SPK_XL+'</span><span>Ketuk untuk mengulang</span></button>';
      low=typeForm(q,false);break;
    default:
      mid='<p class="cue">Tulis dalam bahasa Inggris</p>'+cueHtml(w)+(w.e?'<p class="meaning">'+w.id+'</p>':'')+'<p class="hintline" id="hintline" aria-live="polite"></p>';
      low=typeForm(q,true);
  }
  app.innerHTML='<main class="wrap play">'+hud()+'<div class="stage">'+mid+'</div>'+low+'<div class="fb" id="fb" role="status"></div></main>';
  if(q.type==='listen'||q.type==='dictate')setTimeout(function(){say(w.en);},250);
  if(q.type==='type'||q.type==='dictate')setTimeout(function(){var a=$('#ans');if(a)a.focus();},60);
}
function pick(i){
  var q=G&&G.q;
  if(!q||G.locked)return;
  var ok=q.opts[i]===q.w;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b,j){
    if(q.opts[j]===q.w)b.classList.add('ok');
    else if(j===i)b.classList.add('no');
    else b.classList.add('dim');
    b.disabled=true;
  });
  feedback(ok,q);
}
function tfAnswer(v){
  var q=G&&G.q;
  if(!q||G.locked)return;
  var ok=((v===1)===q.truth);
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
    var bv=parseInt(b.getAttribute('data-v'),10);
    if((bv===1)===q.truth)b.classList.add('ok');
    else if(bv===v)b.classList.add('no');
    else b.classList.add('dim');
    b.disabled=true;
  });
  feedback(ok,q);
}
function record(w,ok,hinted){
  var rec=S.w[w.en]||(S.w[w.en]={s:0});
  rec.s=ok?Math.min(3,rec.s+1):Math.max(0,rec.s-1);
  G.asked++;
  if(ok){G.right++;var gain=hinted?5:10;G.xp+=gain;S.xp+=gain;}
  if(!(w.en in G.log)){G.log[w.en]=ok;G.order.push(w);}else if(!ok){G.log[w.en]=false;}
}
function feedback(ok,q){
  var w=q.w;
  G.locked=true;
  record(w,ok,q.hinted);
  save();sfx(ok);
  var bl=$('#blank');
  if(bl){bl.textContent=w.en;bl.className='blank '+(ok?'ok':'no');}
  var fb=$('#fb');
  if(fb){
    fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML=ok?'<b>Benar</b><span>'+w.en+' = '+w.id+'</span>':'<b>Jawaban: '+w.en+'</b><span>artinya '+w.id+'</span><button class="btn sm" data-act="next">Lanjut</button>';
  }
  if(!(ok&&(q.type==='listen'||q.type==='dictate')))setTimeout(function(){say(w.en);},300);
  G.adv=setTimeout(next,ok?1100:2800);
}
function finishMatch(q){
  G.locked=true;
  var good=0;
  q.mw.forEach(function(w,i){var ok=!q.bad[i];if(ok)good++;record(w,ok,false);});
  save();
  var fb=$('#fb');
  if(fb){
    fb.className='fb '+(good===4?'good':'bad');
    fb.innerHTML=good===4?'<b>Sempurna</b><span>Empat pasangan benar tanpa salah.</span>':'<b>'+good+' dari 4 tanpa salah</b><span>Kata yang salah akan muncul lagi.</span>';
  }
  G.adv=setTimeout(next,1400);
}
function matchLeft(i){
  var q=G&&G.q;
  if(!q||G.locked||q.type!=='match')return;
  var L=app.querySelectorAll('[data-act="mL"]');
  if(L[i].disabled)return;
  Array.prototype.forEach.call(L,function(b){b.classList.remove('sel');});
  L[i].classList.add('sel');
  q.sel=i;
  say(q.mw[i].en);
}
function matchRight(j){
  var q=G&&G.q;
  if(!q||G.locked||q.type!=='match'||q.sel<0)return;
  var R=app.querySelectorAll('[data-act="mR"]'),L=app.querySelectorAll('[data-act="mL"]');
  if(R[j].disabled)return;
  var i=q.sel;q.sel=-1;
  if(q.mr[j]===i){
    L[i].classList.remove('sel');L[i].classList.add('ok');L[i].disabled=true;
    R[j].classList.add('ok');R[j].disabled=true;
    sfx(true);q.done++;
    if(q.done===4)finishMatch(q);
  }else{
    q.bad[i]=true;sfx(false);
    L[i].classList.remove('sel');L[i].classList.add('no');R[j].classList.add('no');
    setTimeout(function(){L[i].classList.remove('no');R[j].classList.remove('no');},450);
  }
}
function scRender(){
  var q=G&&G.q,sc=$('#sc');
  if(sc&&q)sc.innerHTML=scHtml(q);
}
function scTile(i){
  var q=G&&G.q;
  if(!q||G.locked||q.type!=='scramble'||q.pick.indexOf(i)>=0)return;
  q.pick.push(i);
  scRender();
  if(q.pick.length===q.w.en.length){
    var ans=q.pick.map(function(k){return q.tiles[k].ch;}).join('');
    var ok=norm(ans)===norm(q.w.en);
    Array.prototype.forEach.call(app.querySelectorAll('.slot'),function(b){b.classList.add(ok?'good':'bad');b.disabled=true;});
    Array.prototype.forEach.call(app.querySelectorAll('.ltr'),function(b){b.disabled=true;});
    feedback(ok,q);
  }
}
function scUndo(p){
  var q=G&&G.q;
  if(!q||G.locked||q.type!=='scramble')return;
  if(p===undefined)q.pick.pop();else q.pick.splice(p,1);
  scRender();
}
function finish(){
  if(!G)return;
  clearInterval(G.timer);clearTimeout(G.adv);
  try{if(CAN_SPEAK)speechSynthesis.cancel();}catch(e){}
  if(G.asked>0){
    var t=new Date(),y=new Date();y.setDate(y.getDate()-1);
    if(S.last!==dkey(t)){S.streak=(S.last===dkey(y))?S.streak+1:1;S.last=dkey(t);}
    save();
  }
  result();
}
function result(){
  var chips=G.order.map(function(w){
    var ok=G.log[w.en];
    return '<li class="chip '+(ok?'ok':'no')+'">'+(w.e?'<i aria-hidden="true">'+w.e+'</i>':'')+'<div><b>'+w.en+'</b><small>'+w.id+'</small></div><em>'+(ok?'Benar':'Perlu diulang')+'</em></li>';
  }).join('');
  app.innerHTML='<main class="wrap">'+
    '<h1 class="brand">Sesi selesai</h1>'+
    (G.asked===0?'<p class="empty">Belum ada jawaban pada sesi ini. Coba lagi, waktunya masih panjang.</p>':
     '<div class="score"><div><b>'+G.right+'/'+G.asked+'</b><span>jawaban benar</span></div><div><b>+'+G.xp+'</b><span>XP</span></div><div><b>'+shownStreak()+'</b><span>hari beruntun</span></div></div>'+
     '<h2>Kata di sesi ini</h2><ul class="chips">'+chips+'</ul>')+
    '<div class="actions"><button class="btn" data-act="again">Main lagi</button><button class="btn ghost" data-act="home">Kembali ke beranda</button></div>'+
    '</main>';
}

/* ---------- Event ---------- */
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='cat'){start(b.getAttribute('data-id'));}
  else if(a==='tlesson'){tLesson(b.getAttribute('data-id'));}
  else if(a==='tstart'){tStart(b.getAttribute('data-id'));}
  else if(a==='tpick'){tPick(parseInt(b.getAttribute('data-i'),10));}
  else if(a==='ttf'){tTf(parseInt(b.getAttribute('data-v'),10));}
  else if(a==='ttile'){tTile(parseInt(b.getAttribute('data-i'),10));}
  else if(a==='tunpick'){tUndo(parseInt(b.getAttribute('data-p'),10));}
  else if(a==='tundo'){tUndo();}
  else if(a==='tnext'){tNext();}
  else if(a==='tend'){home();}
  else if(a==='tagain'){tStart(TG?TG.id:'all');}
  else if(a==='dur'){S.dur=parseInt(b.getAttribute('data-v'),10);save();home();}
  else if(a==='mode'){S.mode=b.getAttribute('data-v');save();home();}
  else if(a==='snd'){S.sound=!S.sound;save();home();}
  else if(a==='speak'){say(b.getAttribute('data-t'));}
  else if(a==='pick'){pick(parseInt(b.getAttribute('data-i'),10));}
  else if(a==='tf'){tfAnswer(parseInt(b.getAttribute('data-v'),10));}
  else if(a==='mL'){matchLeft(parseInt(b.getAttribute('data-i'),10));}
  else if(a==='mR'){matchRight(parseInt(b.getAttribute('data-j'),10));}
  else if(a==='tile'){scTile(parseInt(b.getAttribute('data-i'),10));}
  else if(a==='unpick'){scUndo(parseInt(b.getAttribute('data-p'),10));}
  else if(a==='undo'){scUndo();}
  else if(a==='next'){next();}
  else if(a==='introok'){
    if(!G||!G.introWord)return;
    G.end+=Date.now()-G.introAt;
    var w=G.introWord;
    var q=makeQ(w,w.e?'pic':'en2id');G.q=q;showQ(q);
  }
  else if(a==='hint'){
    if(!G||G.locked||!G.q)return;
    var hw=G.q.w;G.q.hinted=true;
    var hl=$('#hintline');
    if(hl)hl.textContent=hw.en.split('').map(function(c,i){return i===0?c:(c===' '?'/':'_');}).join(' ');
    var inp=$('#ans');if(inp)inp.focus();
  }
  else if(a==='end'){finish();}
  else if(a==='again'){start(G?G.cat:'all');}
  else if(a==='home'){home();}
});
app.addEventListener('submit',function(e){
  e.preventDefault();
  if(TG){tSubmit();return;}
  if(!G||G.locked||!G.q||(G.q.type!=='type'&&G.q.type!=='dictate'))return;
  var inp=$('#ans');
  var v=inp?norm(inp.value):'';
  if(!v)return;
  if(inp)inp.disabled=true;
  feedback(v===norm(G.q.w.en),G.q);
});

/* ---------- Tenses ---------- */
var TG=null,TMAP={},TITEMS=[];
TENSES.forEach(function(t,ci){
  t.c=COLORS[(ci+3)%COLORS.length];TMAP[t.id]=t;
  t.list=t.items.map(function(s){
    var p=s.split('|');
    var it={t:t.id,core:t.grp!=='more',s:p[0],a:p[1],d:[p[2],p[3],p[4]],tr:p[5]};
    it.verb=/___ \(/.test(p[0]);
    it.full=tfull(p[0],p[1]);
    TITEMS.push(it);
    return it;
  });
});
function tfull(s,a){return s.replace(/___( \([^)]*\))?/,function(){return a;});}
function tblank(it,id){
  return it.s.replace(/___( \(([^)]*)\))?/,function(m,x,v){
    return '<span class="blank" id="'+(id||'tblank')+'">&nbsp;&nbsp;&nbsp;&nbsp;</span>'+(v?' <span class="vb">('+v+')</span>':'');
  });
}
function tCard(t){
  var b=(S.t[t.id]&&S.t[t.id].best)||0;
  return '<button class="cat" style="--c:'+t.c+'" data-act="tlesson" data-id="'+t.id+'">'+
    '<span class="tile">'+t.ico+'</span>'+
    '<span class="nm">'+t.name+'<small>'+t.idn+'</small></span>'+
    '<span class="meter"><i style="width:'+(b*10)+'%"></i></span>'+
    '<span class="cnt">Skor terbaik '+b+'/10</span></button>';
}
function tHomeHtml(){
  return '<h2>Grammar: Tenses ('+TITEMS.length+' soal latihan)</h2>'+
    '<div class="cats"><button class="cat all" data-act="tstart" data-id="all"><span class="tile" style="--c:var(--accent)">🧠</span><span class="grow"><span class="nm">Campur semua tenses<small>10 soal acak dari '+TENSES.length+' materi</small></span></span></button></div>'+
    TGRP.map(function(g){
      return '<h2>'+g[1]+'</h2><div class="cats">'+TENSES.filter(function(t){return t.grp===g[0];}).map(tCard).join('')+'</div>';
    }).join('');
}
function tLesson(id){
  var t=TMAP[id];if(!t){home();return;}
  if(TG){clearTimeout(TG.adv);TG=null;}
  try{if(CAN_SPEAK)speechSynthesis.cancel();}catch(e){}
  var ex=t.list.slice(0,3).map(function(it){
    return '<li><div><b>'+it.full+'</b><small>'+it.tr+'</small></div>'+spk(it.full,'')+'</li>';
  }).join('');
  var fm=t.formula.map(function(f){
    return '<div class="fm"><span class="fl">'+f[0]+'</span><code>'+f[1]+'</code><span class="fe">'+f[2]+'</span></div>';
  }).join('');
  app.innerHTML='<main class="wrap lesson">'+
    '<header class="top"><button class="icon-btn" data-act="home" aria-label="Kembali ke beranda">'+ICON_X+'</button></header>'+
    '<div><p class="cue lk" style="--c:'+t.c+'">'+t.ico+' '+t.idn+'</p><h1 class="brand">'+t.name+'</h1></div>'+
    '<h2>Kapan dipakai</h2><ul class="uses">'+t.use.map(function(u){return '<li>'+u+'</li>';}).join('')+'</ul>'+
    '<h2>Rumus</h2><div class="fms">'+fm+'</div>'+
    '<h2>Kata penanda</h2><p class="sig">'+t.signals+'</p>'+

    '<h2>Contoh kalimat</h2><ul class="chips exs">'+ex+'</ul>'+
    '<div class="actions"><button class="btn" data-act="tstart" data-id="'+t.id+'">Mulai latihan 10 soal</button></div>'+
    '</main>';
  window.scrollTo&&window.scrollTo(0,0);

function tStart(id){
  var pool=id==='all'?TITEMS:(TMAP[id]?TMAP[id].list:TITEMS);
  if(!TMAP[id])id='all';
  if(TG)clearTimeout(TG.adv);
  TG={id:id,qs:shuffle(pool).slice(0,10),i:-1,right:0,xp:0,wrong:[],locked:true,adv:null,q:null,last:''};
  tNext();
}
function tMake(it){
  var types=['mc','tf','scramble'];
  if(it.verb){types.push('type');types.push('type');}
  if(it.core)types.push('ident');
  if(types.length>1&&TG.last){types=types.filter(function(x){return x!==TG.last;});}
  var type=rand(types);
  var q={it:it,type:type};
  if(type==='mc'){q.opts=shuffle([it.a].concat(it.d));q.right=it.a;}
  else if(type==='tf'){q.shown=Math.random()<0.5?it.a:rand(it.d);q.truth=(q.shown===it.a);}
  else if(type==='scramble'){
    var words=it.full.split(' ');
    var tiles,tries=0;
    do{tiles=shuffle(words.map(function(w,i){return {w:w,i:i};}));tries++;}
    while(tries<8&&words.length>1&&tiles.every(function(x,i){return x.i===i;}));
    q.tiles=tiles;q.pick=[];
  }else if(type==='ident'){
    var core=TENSES.filter(function(t){return t.grp!=='more'&&t.id!==it.t;});
    q.opts=shuffle([it.t].concat(shuffle(core).slice(0,3).map(function(t){return t.id;})));
    q.right=it.t;
  }
  return q;
}
function tHud(){
  return '<div class="hud"><button class="icon-btn" data-act="tend" aria-label="Akhiri latihan">'+ICON_X+'</button>'+
    '<div class="track"><i id="bar" style="width:'+(TG.i/TG.qs.length*100)+'%"></i></div><span class="clock">'+(TG.i+1)+'/'+TG.qs.length+'</span></div>';
}
function tNext(){
  if(!TG)return;
  clearTimeout(TG.adv);
  TG.i++;
  if(TG.i>=TG.qs.length){tFinish();return;}
  var q=tMake(TG.qs[TG.i]);
  TG.q=q;TG.last=q.type;TG.locked=false;
  tShow(q);
}
function tOptsHtml(q,names){
  return '<div class="opts">'+q.opts.map(function(o,i){
    return '<button class="opt txt" data-act="tpick" data-i="'+i+'">'+(names?TMAP[o].name:o)+'</button>';
  }).join('')+'</div>';
}
function tScHtml(q){
  var slots=q.pick.map(function(ti,p){
    return '<button class="wt on" data-act="tunpick" data-p="'+p+'">'+q.tiles[ti].w+'</button>';
  }).join('');
  var tiles=q.tiles.map(function(t,i){
    return '<button class="wt" data-act="ttile" data-i="'+i+'"'+(q.pick.indexOf(i)>=0?' disabled':'')+'>'+t.w+'</button>';
  }).join('');
  return '<div class="wslots" id="wsl">'+(slots||'<span class="ph">Ketuk kata di bawah untuk menyusun kalimat</span>')+'</div><div class="wtiles">'+tiles+'</div><button class="link" data-act="tundo" type="button">Hapus kata terakhir</button>';
}
function tShow(q){
  var it=q.it,mid='',low='';
  switch(q.type){
    case 'mc':
      mid='<p class="cue">Pilih bentuk yang tepat</p><p class="sent">'+tblank(it)+'</p><p class="example">'+it.tr+'</p>';
      low=tOptsHtml(q,false);break;
    case 'type':
      mid='<p class="cue">Ketik bentuk yang tepat dari kata kerja dalam kurung</p><p class="sent">'+tblank(it)+'</p><p class="example">'+it.tr+'</p>';
      low='<form class="type" id="tf" autocomplete="off"><input id="ans" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Jawaban" placeholder="ketik jawaban"><button class="btn" type="submit">Cek</button></form>';break;
    case 'tf':
      mid='<p class="cue">Apakah kalimat ini benar secara tata bahasa?</p><p class="sent">'+tfull(it.s,q.shown)+'</p>';
      low='<div class="opts"><button class="opt txt" data-act="ttf" data-v="1">Benar</button><button class="opt txt" data-act="ttf" data-v="0">Salah</button></div>';break;
    case 'scramble':
      mid='<p class="cue">Susun kata menjadi kalimat yang benar</p><p class="example">'+it.tr+'</p>';
      low='<div id="tsc" class="stage" style="flex:none;gap:12px;align-items:stretch">'+tScHtml(q)+'</div>';break;
    default:
      mid='<p class="cue">Kalimat ini memakai tense apa?</p><p class="sent">'+it.full+'</p><p class="example">'+it.tr+'</p>';
      low=tOptsHtml(q,true);
  }
  app.innerHTML='<main class="wrap play">'+tHud()+'<div class="stage">'+mid+'</div>'+low+'<div class="fb" id="fb" role="status"></div></main>';
  if(q.type==='type')setTimeout(function(){var a=$('#ans');if(a)a.focus();},60);
}
function tFeedback(ok){
  var q=TG.q,it=q.it;
  TG.locked=true;
  if(ok){TG.right++;TG.xp+=10;S.xp+=10;}else{TG.wrong.push(it);}
  save();sfx(ok);
  var bl=$('#tblank');
  if(bl){bl.textContent=it.a;bl.className='blank '+(ok?'ok':'no');}
  var head,extra='';
  if(q.type==='ident'){head=ok?'Benar: '+TMAP[it.t].name:'Jawaban: '+TMAP[it.t].name;}
  else if(q.type==='tf'){head=ok?'Benar':(q.truth?'Kalimat itu sebenarnya benar':'Kalimat yang benar:');}
  else{head=ok?'Benar':'Jawaban: '+it.a;}
  var fb=$('#fb');
  if(fb){
    fb.className='fb '+(ok?'good':'bad');
    fb.innerHTML='<b>'+head+'</b><span>'+it.full+'</span><span class="trl">'+it.tr+'</span>'+(ok?'':'<button class="btn sm" data-act="tnext">Lanjut</button>');
  }
  setTimeout(function(){say(it.full);},300);
  TG.adv=setTimeout(tNext,ok?1600:4200);
}
function tPick(i){
  var q=TG&&TG.q;
  if(!q||TG.locked||(q.type!=='mc'&&q.type!=='ident'))return;
  var ok=q.opts[i]===q.right;
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b,j){
    if(q.opts[j]===q.right)b.classList.add('ok');
    else if(j===i)b.classList.add('no');
    else b.classList.add('dim');
    b.disabled=true;
  });
  tFeedback(ok);
}
function tTf(v){
  var q=TG&&TG.q;
  if(!q||TG.locked||q.type!=='tf')return;
  var ok=((v===1)===q.truth);
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){
    var bv=parseInt(b.getAttribute('data-v'),10);
    if((bv===1)===q.truth)b.classList.add('ok');
    else if(bv===v)b.classList.add('no');
    else b.classList.add('dim');
    b.disabled=true;
  });
  tFeedback(ok);
}
function tScRender(){
  var q=TG&&TG.q,sc=$('#tsc');
  if(sc&&q)sc.innerHTML=tScHtml(q);
}
function tTile(i){
  var q=TG&&TG.q;
  if(!q||TG.locked||q.type!=='scramble'||q.pick.indexOf(i)>=0)return;
  q.pick.push(i);
  tScRender();
  if(q.pick.length===q.tiles.length){
    var ans=q.pick.map(function(k){return q.tiles[k].w;}).join(' ');
    var ok=ans===q.it.full;
    Array.prototype.forEach.call(app.querySelectorAll('.wt'),function(b){
      if(b.classList.contains('on'))b.classList.add(ok?'good':'bad');
      b.disabled=true;
    });
    tFeedback(ok);
  }
}
function tUndo(p){
  var q=TG&&TG.q;
  if(!q||TG.locked||q.type!=='scramble')return;
  if(p===undefined)q.pick.pop();else q.pick.splice(p,1);
  tScRender();
}
function tSubmit(){
  var q=TG&&TG.q;
  if(!q||TG.locked||q.type!=='type')return;
  var inp=$('#ans');
  var v=inp?norm(inp.value):'';
  if(!v)return;
  if(inp)inp.disabled=true;
  tFeedback(v===norm(q.it.a));
}
function tFinish(){
  if(!TG)return;
  clearTimeout(TG.adv);
  try{if(CAN_SPEAK)speechSynthesis.cancel();}catch(e){}
  var rec=S.t[TG.id]||(S.t[TG.id]={best:0});
  rec.best=Math.max(rec.best||0,TG.right);
  var t=new Date(),y=new Date();y.setDate(y.getDate()-1);
  if(S.last!==dkey(t)){S.streak=(S.last===dkey(y))?S.streak+1:1;S.last=dkey(t);}
  save();
  var n=TG.qs.length;
  var wrong=TG.wrong.map(function(it){
    return '<li class="chip no"><div><b>'+it.full+'</b><small>'+it.tr+'</small></div></li>';
  }).join('');
  app.innerHTML='<main class="wrap">'+
    '<h1 class="brand">Latihan selesai</h1>'+
    '<div class="score"><div><b>'+TG.right+'/'+n+'</b><span>jawaban benar</span></div><div><b>+'+TG.xp+'</b><span>XP</span></div><div><b>'+shownStreak()+'</b><span>hari beruntun</span></div></div>'+
    (wrong?'<h2>Kalimat yang perlu diulang</h2><ul class="chips">'+wrong+'</ul>':'<p class="empty">Semua jawaban benar. Mantap.</p>')+
    '<div class="actions"><button class="btn" data-act="tagain">Latihan lagi</button>'+
    (TG.id!=='all'?'<button class="btn ghost" data-act="tlesson" data-id="'+TG.id+'">Lihat materi</button>':'')+
    '<button class="btn ghost" data-act="home">Kembali ke beranda</button></div>'+
    '</main>';
  TG.locked=true;
}

/*TESTHOOK*/
home();
})();
</script>
